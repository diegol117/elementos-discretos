<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuntes de Teoría — Estructuras Discretas</title>
    <!-- Estilos limpios tipo GitHub -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <!-- KaTeX para matemáticas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Marked para convertir Markdown a HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 920px;
            margin: 0 auto;
            padding: 32px 20px;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0d1117;
                color: #c9d1d9;
            }
        }
    </style>
</head>
<body>
    <article id="contenido" class="markdown-body">Cargando apuntes...</article>

    <script>
        const params = new URLSearchParams(window.location.search);

        // 1. Apunta por defecto a la carpeta assets/docs/ si no se especifica otro documento en la URL
        const archivoPorDefecto = 'assets/docs/README.md'; // O el nombre de tu archivo .md dentro de esa carpeta
        const archivo = params.get('doc') || archivoPorDefecto;

        fetch(archivo)
            .then(res => {
                if (!res.ok) throw new Error(`No se pudo encontrar el archivo: ${archivo} (Estado: ${res.status})`);
                return res.text();
            })
            .then(md => {
                const contenedor = document.getElementById('contenido');
                // Traduce el markdown a HTML
                contenedor.innerHTML = marked.parse(md);

                // 2. Renderiza KaTeX de forma síncrona asegurando que tome el contenido ya inyectado
                renderMathInElement(contenedor, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            })
            .catch(err => {
                document.getElementById('contenido').innerHTML = `
                    <div style="color: #da3633; padding: 20px; border: 1px solid #da3633; border-radius: 6px; background: rgba(218,54,51,0.1);">
                        <h3>Error al cargar el documento</h3>
                        <p>${err.message}</p>
                        <p><small>Verifica que el archivo exista en tu repositorio dentro de 'assets/docs/' y que la ruta sea correcta.</small></p>
                    </div>`;
            });
    </script>
</body>
</html>
